name: Buddy Lite for Mac

# Every release gets its Mac app without anyone asking:
#   - a release is published  -> build that tag, give the app the release's version, test it on Apple Silicon
#                                and Intel, attach Buddy-mac.zip to that release and refresh docs/latest.json.
#   - every 6 hours           -> if the latest release still has no Buddy-mac.zip (a build failed, or GitHub had
#                                no macOS runner), build and attach it. Otherwise this costs a few seconds.
#   - a push that touches mac -> build and test only.
#   - by hand, publish ticked -> build this branch and attach it to the latest release.

on:
  push:
    branches: ["**"]             # not tags: a release starts its own run below
    paths:
      - "mac/**"
      - ".github/workflows/mac.yml"
  release:
    types: [published]
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload Buddy-mac.zip to the latest release"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write                 # publish starts the "Update manifest" workflow

env:
  # python.org's macOS installer is a universal2 build (Apple Silicon + Intel in one binary)
  PYTHON_PKG: https://www.python.org/ftp/python/3.12.8/python-3.12.8-macos11.pkg
  PY: /Library/Frameworks/Python.framework/Versions/3.12/bin/python3.12

jobs:
  plan:
    # Decides what this run does: which commit to build, and which release (if any) gets the zip.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.plan.outputs.build }}
      ref: ${{ steps.plan.outputs.ref }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          WANT_PUBLISH: ${{ inputs.publish }}
        run: |
          build=true
          ref="$GITHUB_SHA"
          tag=""
          case "$EVENT" in
            release)
              tag="$RELEASE_TAG"
              ref="$RELEASE_TAG"
              ;;
            workflow_dispatch)
              if [ "$WANT_PUBLISH" = "true" ]; then
                tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
              fi
              ;;
            schedule)
              latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName,publishedAt,assets)
              tag=$(jq -r .tagName <<<"$latest")
              ref="$tag"
              has_mac=$(jq -r '[.assets[].name] | index("Buddy-mac.zip") != null' <<<"$latest")
              age=$(( $(date +%s) - $(date -d "$(jq -r .publishedAt <<<"$latest")" +%s) ))
              # Younger than 2 hours: the run its release started may still be building.
              if [ "$has_mac" = "true" ] || [ "$age" -lt 7200 ]; then
                echo "Nothing to do: $tag has Buddy-mac.zip ($has_mac) or is only $age s old."
                build=false
                tag=""
              fi
              ;;
          esac
          echo "event=$EVENT build=$build ref=$ref tag=$tag"
          {
            echo "build=$build"
            echo "ref=$ref"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: macos-15            # Apple Silicon (macos-14 was retired on 2026-11-02): builds the universal app and tests the arm64 half
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}

      - name: Take the release's version
        # The Mac app always carries the version of the release it ships in, so nobody has to remember to
        # raise VERSION in mac/buddy_mac/core.py when only Windows changed.
        if: needs.plan.outputs.tag != ''
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::release tag $TAG is not a version like v1.2.3"
            exit 1
          fi
          sed -i '' -E "s/^VERSION = \"[^\"]*\"$/VERSION = \"$version\"/" mac/buddy_mac/core.py
          grep -n '^VERSION = ' mac/buddy_mac/core.py
          grep -qx "VERSION = \"$version\"" mac/buddy_mac/core.py

      - name: Universal Python (python.org)
        run: |
          curl -sSLo /tmp/python.pkg "$PYTHON_PKG"
          sudo installer -pkg /tmp/python.pkg -target / >/dev/null
          "$PY" -c "import platform, sysconfig; print(platform.machine(), sysconfig.get_platform())"
          lipo -archs "$("$PY" -c 'import sys; print(sys.executable)')"

      - name: Install
        run: |
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install --only-binary=:all: -r mac/requirements.txt
          "$PY" -m pip install pytest pyinstaller

      - name: Unit tests
        run: |
          "$PY" -m pytest mac/tests -q

      - name: Pointing benchmark (Vision text snapping)
        run: |
          "$PY" mac/tests/bench_snap.py

      - name: Self-test from source (real AppKit, fake brain)
        working-directory: mac
        env:
          BUDDY_SELFTEST_LIVE_CLICK: "1"       # also post one real click and report whether Buddy heard it
        run: |
          "$PY" BuddyMac.py --selftest "$RUNNER_TEMP/selftest_source" || echo "SOURCE_SELFTEST_FAILED=1" >> "$GITHUB_ENV"

      - name: App icon
        run: |
          mkdir -p build/Buddy.iconset
          for size in 16 32 64 128 256 512; do
            sips -z $size $size docs/assets/buddy.png --out build/Buddy.iconset/icon_${size}x${size}.png >/dev/null
            double=$((size * 2))
            sips -z $double $double docs/assets/buddy.png --out build/Buddy.iconset/icon_${size}x${size}@2x.png >/dev/null
          done
          iconutil -c icns build/Buddy.iconset -o build/Buddy.icns

      - name: Build Buddy.app (universal2)
        working-directory: mac
        run: |
          VERSION=$("$PY" -c "from buddy_mac import core; print(core.VERSION)")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          "$PY" -m PyInstaller --noconfirm --windowed --name Buddy \
            --target-architecture universal2 \
            --osx-bundle-identifier io.github.juw12.buddy \
            --icon ../build/Buddy.icns \
            --hidden-import Speech --hidden-import AVFoundation --hidden-import Quartz --hidden-import Vision \
            --hidden-import NaturalLanguage \
            BuddyMac.py
          PLIST=dist/Buddy.app/Contents/Info.plist
          plutil -replace CFBundleShortVersionString -string "$VERSION" "$PLIST"
          plutil -replace CFBundleVersion -string "$VERSION" "$PLIST"
          plutil -insert LSUIElement -bool true "$PLIST"
          plutil -insert LSMinimumSystemVersion -string "12.0" "$PLIST"
          plutil -insert NSMicrophoneUsageDescription -string "Buddy listens while you hold Control+Option+Space, so you can ask out loud." "$PLIST"
          plutil -insert NSLocalNetworkUsageDescription -string "Buddy sends your question to the brain you set: Ollama on this Mac or a server on your network." "$PLIST"
          plutil -insert NSSpeechRecognitionUsageDescription -string "Buddy turns your question into text with Apple's speech recognition (on this Mac when possible)." "$PLIST"
          # Ad-hoc signature (no Apple Developer ID): required to run on Apple Silicon
          codesign --force --deep --sign - dist/Buddy.app
          codesign --verify --deep --strict --verbose=2 dist/Buddy.app
          echo "Main binary:"; lipo -archs dist/Buddy.app/Contents/MacOS/Buddy
          # Every Mach-O inside must carry both architectures
          thin=0
          while IFS= read -r file; do
            archs=$(lipo -archs "$file" 2>/dev/null || true)
            if [ -n "$archs" ] && { [[ "$archs" != *x86_64* ]] || [[ "$archs" != *arm64* ]]; }; then
              echo "NOT UNIVERSAL: $file ($archs)"; thin=1
            fi
          done < <(find dist/Buddy.app -type f \( -name "*.so" -o -name "*.dylib" -o -perm -111 \))
          test $thin -eq 0
          du -sh dist/Buddy.app

      - name: Self-test the built app (Apple Silicon)
        working-directory: mac
        env:
          BUDDY_SELFTEST_LIVE_CLICK: "1"
        run: |
          ./dist/Buddy.app/Contents/MacOS/Buddy --selftest "$RUNNER_TEMP/selftest_arm64"
          "$PY" -c "import json,sys; r=json.load(open('$RUNNER_TEMP/selftest_arm64/report.json')); print(r['checks']); print('live click:', r.get('live_click')); sys.exit(0 if r['passed'] else 1)"

      - name: Zip
        working-directory: mac/dist
        run: |
          ditto -c -k --sequesterRsrc --keepParent Buddy.app Buddy-mac.zip
          ls -lh Buddy-mac.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-arm64
          path: |
            ${{ runner.temp }}/selftest_source
            ${{ runner.temp }}/selftest_arm64
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: Buddy-mac
          path: mac/dist/Buddy-mac.zip

  intel:
    needs: build
    runs-on: macos-15-intel      # a real Intel Mac: run the same zip natively on x86_64
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Buddy-mac

      - name: Unzip and check
        run: |
          uname -m
          ditto -x -k Buddy-mac.zip .
          lipo -archs Buddy.app/Contents/MacOS/Buddy
          codesign --verify --deep --strict Buddy.app

      - name: Self-test on Intel
        env:
          BUDDY_SELFTEST_LIVE_CLICK: "1"
        run: |
          ./Buddy.app/Contents/MacOS/Buddy --selftest "$RUNNER_TEMP/selftest_intel"
          python3 -c "import json,sys; r=json.load(open('$RUNNER_TEMP/selftest_intel/report.json')); print(r['checks']); print('live click:', r.get('live_click')); sys.exit(0 if r['passed'] else 1)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-intel
          path: ${{ runner.temp }}/selftest_intel
          if-no-files-found: warn

  publish:
    needs: [plan, build, intel]
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Buddy-mac
      - name: Attach to the release and refresh the manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          # The manifest gives the Mac entry the release's version; an app with another version would offer itself
          # as an update forever. Refuse to upload unless the app inside the zip has the release's version.
          APP_VERSION=$(unzip -p Buddy-mac.zip Buddy.app/Contents/Info.plist | python3 -c "import plistlib,sys; print(plistlib.loads(sys.stdin.buffer.read())['CFBundleShortVersionString'])")
          if [ "$APP_VERSION" != "${TAG#v}" ]; then
            echo "::error::Buddy.app is $APP_VERSION but the release is $TAG"
            exit 1
          fi
          # The 6-hourly catch-up never replaces a zip that arrived in the meantime: latest.json already
          # carries that file's SHA-256.
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx "Buddy-mac.zip"; then
            echo "$TAG already has Buddy-mac.zip, leaving it alone."
            exit 0
          fi
          gh release upload "$TAG" Buddy-mac.zip --clobber --repo "$GITHUB_REPOSITORY"
          # docs/latest.json (auto-update and the one-line installer) takes the new file's size and SHA-256.
          gh workflow run manifest.yml --repo "$GITHUB_REPOSITORY" --ref main
