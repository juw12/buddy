name: Buddy Lite for Mac

on:
  push:
    paths:
      - "mac/**"
      - ".github/workflows/mac.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload Buddy-mac.zip to the latest release"
        type: boolean
        default: false

permissions:
  contents: write

env:
  # python.org's macOS installer is a universal2 build (Apple Silicon + Intel in one binary)
  PYTHON_PKG: https://www.python.org/ftp/python/3.12.8/python-3.12.8-macos11.pkg
  PY: /Library/Frameworks/Python.framework/Versions/3.12/bin/python3.12

jobs:
  build:
    runs-on: macos-15            # Apple Silicon (macos-14 was retired on 2026-11-02): builds the universal app and tests the arm64 half
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Universal Python (python.org)
        run: |
          curl -sSLo /tmp/python.pkg "$PYTHON_PKG"
          sudo installer -pkg /tmp/python.pkg -target / >/dev/null
          "$PY" -c "import platform, sysconfig; print(platform.machine(), sysconfig.get_platform())"
          lipo -archs "$("$PY" -c 'import sys; print(sys.executable)')"

      - name: Install
        run: |
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install --only-binary=:all: -r mac/requirements.txt
          "$PY" -m pip install pytest pyinstaller

      - name: Unit tests
        run: |
          "$PY" -m pytest mac/tests -q

      - name: Pointing benchmark (Vision text snapping)
        run: |
          "$PY" mac/tests/bench_snap.py

      - name: Self-test from source (real AppKit, fake brain)
        working-directory: mac
        run: |
          "$PY" BuddyMac.py --selftest "$RUNNER_TEMP/selftest_source" || echo "SOURCE_SELFTEST_FAILED=1" >> "$GITHUB_ENV"

      - name: App icon
        run: |
          mkdir -p build/Buddy.iconset
          for size in 16 32 64 128 256 512; do
            sips -z $size $size docs/assets/buddy.png --out build/Buddy.iconset/icon_${size}x${size}.png >/dev/null
            double=$((size * 2))
            sips -z $double $double docs/assets/buddy.png --out build/Buddy.iconset/icon_${size}x${size}@2x.png >/dev/null
          done
          iconutil -c icns build/Buddy.iconset -o build/Buddy.icns

      - name: Build Buddy.app (universal2)
        working-directory: mac
        run: |
          VERSION=$("$PY" -c "from buddy_mac import core; print(core.VERSION)")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          "$PY" -m PyInstaller --noconfirm --windowed --name Buddy \
            --target-architecture universal2 \
            --osx-bundle-identifier io.github.juw12.buddy \
            --icon ../build/Buddy.icns \
            --hidden-import Speech --hidden-import AVFoundation --hidden-import Quartz --hidden-import Vision \
            --hidden-import NaturalLanguage \
            BuddyMac.py
          PLIST=dist/Buddy.app/Contents/Info.plist
          plutil -replace CFBundleShortVersionString -string "$VERSION" "$PLIST"
          plutil -replace CFBundleVersion -string "$VERSION" "$PLIST"
          plutil -insert LSUIElement -bool true "$PLIST"
          plutil -insert LSMinimumSystemVersion -string "12.0" "$PLIST"
          plutil -insert NSMicrophoneUsageDescription -string "Buddy listens while you hold Control+Option+Space, so you can ask out loud." "$PLIST"
          plutil -insert NSLocalNetworkUsageDescription -string "Buddy sends your question to the brain you set: Ollama on this Mac or a server on your network." "$PLIST"
          plutil -insert NSSpeechRecognitionUsageDescription -string "Buddy turns your question into text with Apple's speech recognition (on this Mac when possible)." "$PLIST"
          # Ad-hoc signature (no Apple Developer ID): required to run on Apple Silicon
          codesign --force --deep --sign - dist/Buddy.app
          codesign --verify --deep --strict --verbose=2 dist/Buddy.app
          echo "Main binary:"; lipo -archs dist/Buddy.app/Contents/MacOS/Buddy
          # Every Mach-O inside must carry both architectures
          thin=0
          while IFS= read -r file; do
            archs=$(lipo -archs "$file" 2>/dev/null || true)
            if [ -n "$archs" ] && { [[ "$archs" != *x86_64* ]] || [[ "$archs" != *arm64* ]]; }; then
              echo "NOT UNIVERSAL: $file ($archs)"; thin=1
            fi
          done < <(find dist/Buddy.app -type f \( -name "*.so" -o -name "*.dylib" -o -perm -111 \))
          test $thin -eq 0
          du -sh dist/Buddy.app

      - name: Self-test the built app (Apple Silicon)
        working-directory: mac
        run: |
          ./dist/Buddy.app/Contents/MacOS/Buddy --selftest "$RUNNER_TEMP/selftest_arm64"
          "$PY" -c "import json,sys; r=json.load(open('$RUNNER_TEMP/selftest_arm64/report.json')); print(r['checks']); sys.exit(0 if r['passed'] else 1)"

      - name: Zip
        working-directory: mac/dist
        run: |
          ditto -c -k --sequesterRsrc --keepParent Buddy.app Buddy-mac.zip
          ls -lh Buddy-mac.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-arm64
          path: |
            ${{ runner.temp }}/selftest_source
            ${{ runner.temp }}/selftest_arm64
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: Buddy-mac
          path: mac/dist/Buddy-mac.zip

  intel:
    needs: build
    runs-on: macos-15-intel      # a real Intel Mac: run the same zip natively on x86_64
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Buddy-mac

      - name: Unzip and check
        run: |
          uname -m
          ditto -x -k Buddy-mac.zip .
          lipo -archs Buddy.app/Contents/MacOS/Buddy
          codesign --verify --deep --strict Buddy.app

      - name: Self-test on Intel
        run: |
          ./Buddy.app/Contents/MacOS/Buddy --selftest "$RUNNER_TEMP/selftest_intel"
          python3 -c "import json,sys; r=json.load(open('$RUNNER_TEMP/selftest_intel/report.json')); print(r['checks']); sys.exit(0 if r['passed'] else 1)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-intel
          path: ${{ runner.temp }}/selftest_intel
          if-no-files-found: warn

  publish:
    needs: [build, intel]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Buddy-mac
      - name: Upload to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          # The manifest gives the Mac entry the release's version; an app with another version would offer itself
          # as an update forever. Refuse to upload unless the app inside the zip has the release's version.
          APP_VERSION=$(unzip -p Buddy-mac.zip Buddy.app/Contents/Info.plist | python3 -c "import plistlib,sys; print(plistlib.loads(sys.stdin.buffer.read())['CFBundleShortVersionString'])")
          if [ "$APP_VERSION" != "${TAG#v}" ]; then
            echo "::error::Buddy.app is $APP_VERSION but the latest release is $TAG; set VERSION in mac/buddy_mac/core.py to ${TAG#v}"
            exit 1
          fi
          gh release upload "$TAG" Buddy-mac.zip --clobber --repo "$GITHUB_REPOSITORY"
