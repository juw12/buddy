name: Update manifest

# Rewrites docs/latest.json (read by Buddy's auto-updaters on Windows, Mac and iPhone) and docs/altstore.json
# (AltStore / SideStore source for the iPhone app) from the latest release, then lets Pages redeploy.
# Runs when a release is published/edited, after the Mac/iPhone workflows upload their files, or by hand.

on:
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-manifest
  cancel-in-progress: false

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/releases/latest" > release.json
      - name: Write docs/latest.json and docs/altstore.json
        run: |
          python tools/release_manifest.py --release release.json
          cat docs/latest.json
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/latest.json docs/altstore.json
          if git diff --cached --quiet; then
            echo "manifest unchanged"
          else
            git commit -m "manifest: $(python -c 'import json;print(json.load(open("docs/latest.json"))["version"])') downloads"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
