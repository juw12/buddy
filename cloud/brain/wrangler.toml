# Buddy's free brain (Cloudflare Workers AI). Deploy: npx wrangler deploy
name = "buddy-brain"
main = "index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "buddy-brain"
database_id = "f81a24c2-8d18-47e8-b3bf-f1686d8405e1"

# 20 questions per minute per IP
[[unsafe.bindings]]
name = "RL"
type = "ratelimit"
namespace_id = "2401"
simple = { limit = 20, period = 60 }
